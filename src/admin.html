<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bibliothek – Verwaltung</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a19" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preload" href="assets/fonts/fira-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/protokoll.js"></script>
<script src="assets/kopf.js"></script>
</head>
<body>
<!-- Erzeugt aus src/admin.html (npm run build) – hier nicht bearbeiten.
     Inhalt von #seite: festes Gerüst mit gesperrtem Entsperren-Knopf, bis assets/verwaltung.js (React) übernimmt. -->
<div id="seite">
<header class="wrap flex items-center justify-between gap-3 pt-[18px] pb-1.5 sm:pt-6 sm:pb-2">
  <a class="logo ld-bild" href="./">
    <img class="logo-l" src="assets/logo-hell.webp" width="360" height="200" decoding="async" alt="Deutsche Schule Mailand – Scuola Germanica di Milano">
    <img class="logo-d" src="assets/logo-dunkel.webp" width="360" height="200" loading="lazy" decoding="async" alt="Deutsche Schule Mailand – Scuola Germanica di Milano">
  </a>
  <div class="flex items-center gap-2">
    <div class="seg relative inline-grid grid-cols-2 rounded-full border border-border bg-background p-[3px]" role="group" aria-label="Sprache · Lingua">
      <button type="button" class="relative z-[1] inline-flex h-8 min-w-10 items-center justify-center rounded-full px-2.5 text-s font-medium text-muted-foreground" lang="de">DE</button>
      <button type="button" class="relative z-[1] inline-flex h-8 min-w-10 items-center justify-center rounded-full px-2.5 text-s font-medium text-muted-foreground" lang="it">IT</button>
    </div>
    <button type="button" class="inline-flex size-10 items-center justify-center rounded-full border border-border bg-background text-foreground" aria-label="Einstellungen · Impostazioni" disabled><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</header>

<section class="wrap intro pt-[18px] pb-3">
  <h1 class="m-0 text-l font-semibold leading-[1.1]">Verwaltung</h1>
  <p class="mt-1.5 mb-0 text-muted-foreground" id="current"></p>
</section>

<main class="wrap">
  <div class="lock grid place-items-center pt-6 pb-15" id="lock">
    <form id="lock-form" autocomplete="off" class="grid w-full max-w-96 gap-3.5 rounded-3xl bg-surface p-[26px] shadow-[inset_0_0_0_1px_var(--line)]">
      <h2 class="m-0 text-l font-semibold">Geschützter Bereich</h2>
      <p class="m-0 text-muted-foreground">Bitte das Passwort der Bibliothek eingeben.</p>
      <input type="password" id="pw" autocomplete="current-password" aria-label="Passwort" required
        class="h-12 w-full min-w-0 rounded-lg border border-input bg-background px-3.5 text-m text-foreground outline-none">
      <!-- gesperrt mit Spinner, bis assets/verwaltung.js (nach books.js) geladen ist -->
      <button type="submit" id="unlock" disabled class="busy inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-md border border-foreground bg-foreground px-[18px] text-m font-semibold whitespace-nowrap text-background"><span class="spin" aria-hidden="true"></span><span>Entsperren</span></button>
      <p class="msg m-0 min-h-[1.4em] font-medium" id="lock-msg" role="alert"></p>
    </form>
  </div>
</main>

<footer class="foot border-t border-border text-s text-muted-foreground">
  <div class="wrap flex flex-wrap justify-between gap-x-4 gap-y-1.5 pt-[18px] pb-7"><span>Bibliothek der Deutschen Schule Mailand · Verwaltung</span><a class="text-inherit no-underline" href="./">Zur Bücherliste</a></div>
</footer>
</div>

<script src="books.js"></script>
<script src="empfehlungen.js"></script>
<script src="info.js"></script>
<script src="assets/covers.js"></script>
<script src="assets/admin.enc.js"></script>
<script src="assets/verwaltung.js"></script>
</body>
</html>
