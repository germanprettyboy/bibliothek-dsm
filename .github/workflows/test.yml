# Tests on GitHub Actions: unit (node --test, incl. save.php with the runner's PHP) and E2E (Playwright: Chromium = Chrome/Edge,
# Firefox, WebKit = Safari; each browser sharded over parallel jobs).
# Runs on every push (all branches) and by hand (Actions → Tests → Run workflow).
# Skipped as locally: real-db.test (data/*.winbook is never committed), data.test info.js (website/info.js not committed),
# encryption "is current" (only if the repository secret DSM_ADMIN_PW exists – optional, see CLAUDE.md "Checking").
# Suite (CLAUDE.md "CI suites", tests/suites.js): full by default; the line "CI-Suite: smoke [area,…]" in the head commit
# message (or the input "suite" of a run by hand) runs unit + one Chromium job with the core tests instead, no Apache job.
name: Tests

on:
  push:
    paths-ignore:
      - "docs/**"
      - "anleitung/**"
      - "**.md"
      - "website/LIESMICH.txt"
  # Weekly, so new npm advisories show up without a push (GitHub mails a failed run)
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: 'full, smoke or "smoke <area>[,<area>…]" (areas: node tests/suites.js)'
        default: full

permissions:
  contents: read

# A newer push to the same branch cancels the older run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: Europe/Rome # as on Johann's Mac and in the browser tests (timezoneId): "today" is the same day everywhere

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: PHP version (save.test)
        run: php -v
      - run: npm test
        env:
          DSM_ADMIN_PW: ${{ secrets.DSM_ADMIN_PW }}
      # Known vulnerabilities in npm packages (runtime ones end up in library.js); high/critical fails the run
      - run: npm audit --audit-level=high
      # save.php promises PHP >= 7.1 (webspace PHP version unknown): syntax + save.test again on the oldest version.
      # Same job on purpose: GitHub bills every job rounded up to a full minute.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0; third-party: pinned to the commit
        with:
          php-version: "7.1"
          coverage: none
      - name: save.php on PHP 7.1
        run: php -l website/save.php && node --test tests/unit/save.test.js

  e2e:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false # one shard failing must not cancel the others
      # Sharding: Chromium's and Firefox's full suites split over parallel jobs (Playwright --shard; balanced per test,
      # fullyParallel). Duration ≈ the slowest shard. WebKit desktop + iPhone only run engines.spec.js: one job.
      # Smoke: a single Chromium job (shard "smoke"). The condition is the same in the apache job; the matrix can't see env.
      matrix:
        include: >-
          ${{ fromJSON((contains(github.event.head_commit.message, 'CI-Suite: smoke') || startsWith(inputs.suite, 'smoke'))
          && '[{"browser":"chromium","shard":"smoke"}]'
          || '[{"browser":"chromium","shard":"1/2"},{"browser":"chromium","shard":"2/2"},{"browser":"firefox","shard":"1/2"},{"browser":"firefox","shard":"2/2"},{"browser":"webkit","shard":"1/1"}]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Playwright version, runner image
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      # Browser and its system packages (the apt .deb files) cached per browser, Playwright version and runner image
      # (a new image brings newer packages): uncached,
      # WebKit alone downloads 117 MB from the Ubuntu mirror (up to 12 min on a slow day). Saved right after the
      # install (not only after a green job), so a failing test doesn't cost the next run the download again.
      - name: Restore ${{ matrix.browser }} and its system packages
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-archives
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      # apt gives up a stalled transfer after 30 s and retries it; besides at most 8 min per attempt (packages
      # already downloaded stay), three attempts. apt runs as root, so `timeout` can't stop it: pkill, otherwise it
      # keeps the dpkg lock for the next attempt.
      - name: Install ${{ matrix.browser }}
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-dsm-retries >/dev/null
          if [ -d ~/apt-archives ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true; fi
          for i in 1 2 3; do
            timeout 480 npx playwright install --with-deps ${{ matrix.browser }} && break
            echo "::warning::playwright install attempt $i failed or hung"
            [ "$i" = 3 ] && exit 1
            sudo pkill -9 -x apt-get || true
            sleep 3
            sudo dpkg --configure -a || true
          done
          mkdir -p ~/apt-archives && cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
      - name: Save ${{ matrix.browser }} and its system packages
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true # two shards of one browser save the same key: the second one may be refused
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-archives
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: PHP version (publish.spec.js, real save.php)
        run: php -v
      - name: CPU cores (Playwright workers)
        run: nproc
      # The WebKit job also runs the iPhone viewport (WebKit device; both only engines.spec.js)
      - if: matrix.shard != 'smoke'
        run: >
          npm run test:e2e -- --project=${{ matrix.browser }} ${{ matrix.browser == 'webkit' && '--project=iphone' || '' }}
          --shard=${{ matrix.shard }}
      # Smoke: playwright.config.js builds the projects from DSM_SUITE (message or input via env, never pasted into the script)
      - if: matrix.shard == 'smoke'
        run: |
          node tests/suites.js "$DSM_SUITE" | tee -a "$GITHUB_STEP_SUMMARY"
          npm run test:e2e
        env:
          DSM_SUITE: ${{ inputs.suite || github.event.head_commit.message }}
      # retries: 1 lets a test pass on the second attempt – list those, so flakiness doesn't stay invisible
      - name: Flaky tests (passed only on the retry)
        if: always()
        run: node tests/helpers/flaky-report.js tests/.tmp/report.json
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}-${{ strategy.job-index }}
          path: tests/.tmp/results/
          retention-days: 7
          if-no-files-found: ignore

  # The upload folder (npm run pack) on a real Apache with PHP 7.1 in Docker, as on a typical webspace:
  # .htaccess (headers, compression, no listings, https redirect), save.php end to end, backup/ locked, parallel POSTs.
  apache:
    name: Apache + PHP 7.1
    if: >-
      ${{ !(contains(github.event.head_commit.message, 'CI-Suite: smoke') || startsWith(inputs.suite, 'smoke')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: docker pull php:7.1-apache
      - run: node --test tests/apache/apache.test.js
        env:
          DSM_APACHE: "1"
