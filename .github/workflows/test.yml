# Tests on GitHub Actions: unit (node --test, incl. save.php with the runner's PHP) and E2E (Playwright: Chromium = Chrome/Edge,
# Firefox, WebKit = Safari; one parallel job per browser).
# Runs on every push (all branches) and by hand (Actions → Tests → Run workflow).
# Skipped as locally: real-db.test (data/*.winbook is never committed), data.test info.js (website/info.js not committed),
# encryption "is current" (only if the repository secret DSM_ADMIN_PW exists – optional, see CLAUDE.md "Checking").
name: Tests

on:
  push:
    paths-ignore:
      - "docs/**"
      - "anleitung/**"
      - "**.md"
      - "website/LIESMICH.txt"
  # Weekly, so new npm advisories show up without a push (GitHub mails a failed run)
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: Europe/Rome # as on Johann's Mac and in the browser tests (timezoneId): "today" is the same day everywhere

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: PHP version (save.test)
        run: php -v
      - run: npm test
        env:
          DSM_ADMIN_PW: ${{ secrets.DSM_ADMIN_PW }}
      # Known vulnerabilities in npm packages (runtime ones end up in library.js); high/critical fails the run
      - run: npm audit --audit-level=high
      # save.php promises PHP >= 7.1 (webspace PHP version unknown): syntax + save.test again on the oldest version.
      # Same job on purpose: GitHub bills every job rounded up to a full minute.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0; third-party: pinned to the commit
        with:
          php-version: "7.1"
          coverage: none
      - name: save.php on PHP 7.1
        run: php -l website/save.php && node --test tests/unit/save.test.js

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false # one browser failing must not cancel the others
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      # Browser download is skipped on a cache hit; --with-deps still installs the system libraries.
      # apt on the runner sometimes stalls on a download for the whole job timeout: apt gives up a stalled transfer
      # after 30 s and retries it; besides at most 8 min per attempt (a slow mirror needs ≈9 min for WebKit's 106 MB;
      # downloaded packages stay for the next attempt), three attempts. apt runs as root, so `timeout` can't stop it:
      # pkill, otherwise it keeps the dpkg lock for the next attempt.
      - name: Install ${{ matrix.browser }}
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-dsm-retries >/dev/null
          for i in 1 2 3; do
            timeout 480 npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "::warning::playwright install attempt $i failed or hung"
            sudo pkill -9 -x apt-get || true
            sleep 3
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: PHP version (publish.spec.js, real save.php)
        run: php -v
      - name: CPU cores (Playwright workers)
        run: nproc
      # The WebKit job also runs the iPhone viewport (WebKit device, only engines.spec.js)
      - run: npm run test:e2e -- --project=${{ matrix.browser }} ${{ matrix.browser == 'webkit' && '--project=iphone' || '' }}
      # retries: 1 lets a test pass on the second attempt – list those, so flakiness doesn't stay invisible
      - name: Flaky tests (passed only on the retry)
        if: always()
        run: node tests/helpers/flaky-report.js tests/.tmp/report.json
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: tests/.tmp/results/
          retention-days: 7
          if-no-files-found: ignore

  # The upload folder (npm run pack) on a real Apache with PHP 7.1 in Docker, as on a typical webspace:
  # .htaccess (headers, compression, no listings, https redirect), save.php end to end, backup/ locked, parallel POSTs.
  apache:
    name: Apache + PHP 7.1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: docker pull php:7.1-apache
      - run: node --test tests/apache/apache.test.js
        env:
          DSM_APACHE: "1"
